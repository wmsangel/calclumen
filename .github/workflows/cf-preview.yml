name: CF preview deploy (manual)

# Manual-only (workflow_dispatch) deploy of a branch to the Cloudflare Worker,
# used to preview the migration on *.workers.dev BEFORE any DNS cutover. It has
# NO push trigger, so it never fires on its own and never touches the live
# Vercel site. It checks out the chosen branch (which carries the OpenNext
# adapter + wrangler.jsonc), builds and deploys.
#
# Needs repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build & deploy to the Worker
        default: cloudflare-ready
        required: true

concurrency:
  group: cf-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
